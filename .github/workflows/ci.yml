name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product:
    name: Packaged product and browser journey
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.11.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Rebuild the locked frontend and check routes/budgets
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          git diff --exit-code -- ../src/inventory_intelligence/product_static
      - name: Install pinned Python package and browser test tooling
        run: |
          bash deploy/render/build.sh
          npm install --prefix /tmp/ii-browser --no-save --ignore-scripts playwright@1.62.1
          /tmp/ii-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate the offline API and complete browser journey
        env:
          PLAYWRIGHT_MODULE: /tmp/ii-browser/node_modules/playwright
        run: |
          python -m uvicorn inventory_intelligence.lab_hosted:app --host 127.0.0.1 --port 8000 \
            --workers 1 --limit-concurrency 16 --backlog 32 --timeout-keep-alive 5 \
            --no-access-log --no-proxy-headers &
          PRODUCT_SERVER=$!
          trap 'kill "$PRODUCT_SERVER"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Product did not become ready')
          PY
          python -m unittest tests.test_product tests.test_product_journey tests.test_product_hosted tests.test_lab_hosted -v
          python -m scripts.check_hosted_lab --base-url http://127.0.0.1:8000
          python scripts/check_product_browser.py --base-url http://127.0.0.1:8000 --output /tmp/product-browser.json

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check change whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Check documentation navigation and integration mode
        run: python3 scripts/check_docs.py
      - name: Validate research metadata JSON
        run: python3 -m json.tool docs/research/repositories.json > /dev/null

  postgres:
    name: PostgreSQL acceptance
    # Keep the declared Python 3.12.12 reference available when latest advances.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.9@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_USER: ii_owner
          POSTGRES_PASSWORD: ii_owner_local
          POSTGRES_DB: inventory_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ii_owner -d inventory_intelligence"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://ii_owner:ii_owner_local@localhost:5432/inventory_intelligence
      DATABASE_URL: postgresql://ii_runner:ii_runner_local@localhost:5432/inventory_intelligence
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Research provenance tests verify original commits and full ancestry.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - name: Install pinned runtime and build dependencies
        run: |
          python -m pip install pip==25.2 setuptools==80.9.0 wheel==0.45.1 typing-extensions==4.16.0
          python -m pip install --no-build-isolation '.[lab]'
      - name: Bootstrap fresh acceptance database
        run: python -m tests.bootstrap
      - name: Assert independent oracles, history, CLI, and role enforcement
        run: python -m unittest discover -s tests -v
