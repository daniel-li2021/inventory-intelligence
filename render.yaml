# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: inventory-intelligence-boss
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: bash deploy/render/build.sh
    startCommand: >-
      python -m uvicorn inventory_intelligence.lab_hosted:app
      --host 0.0.0.0 --port $PORT --workers 1
      --limit-concurrency 16 --backlog 32 --timeout-keep-alive 5
      --no-access-log --no-proxy-headers
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
